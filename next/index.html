<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We've moved</title>
  <meta name="theme-color" content="#111317">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111317; color: #e9ebef; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 420px; padding: 24px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #c9ced6; }
    a.go { display: block; margin-top: 18px; padding: 14px; border-radius: 12px; background: #4f8cff; color: #fff; font-weight: 700; text-decoration: none; }
    .muted { color: #8e95a2; font-size: 14px; margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <h1>🎨 We've moved</h1>
  <p>This test version of Paint Checker is now <b>Bad Influence Hobby</b>, at a new address.</p>
  <a class="go" href="https://badinfluencehobby.com/">Open badinfluencehobby.com</a>
  <p class="muted">Sign in there with the same email and your paints will be waiting. Then add it to your home screen from the new address and remove this old icon.</p>
</main>
<script>
  // This page replaces the old test app, so its offline helper is no longer needed here.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
</script>
</body>
</html>
